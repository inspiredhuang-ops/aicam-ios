# Codemagic 云端构建流水线（Windows 上无需 Mac）
# 本文件位于 Git 仓库根目录，推送到 GitHub 后 Codemagic 自动识别。
#
# 首次使用只需在 Codemagic 网页做 2 件事（详见 上架指南-Windows.md 第 4 节）：
#   1) Add application，关联 inspiredhuang-ops/aicam-ios 仓库
#   2) Team settings → Integrations → Developer Portal → Manage keys → Add key
#      名称必须填：aicam_key
#      粘贴 App Store Connect 的 Issuer ID、Key ID，上传 .p8 文件
#   这一条密钥同时用于：自动创建证书/描述文件（签名）+ 上传 TestFlight（发布）
# 然后把下方 email 改成你的邮箱，点 Start new build 即可。

workflows:
  ios-build:
    name: AICAM iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: aicam_key
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.aicam.camera
      node: v22
      xcode: latest
      cocoapods: default
    scripts:
      - name: 同步网页资源（web/ 快照 -> www/）
        script: |
          npm install
          node scripts/sync-web.mjs
      - name: 添加并同步 iOS 平台（含 pod install）
        script: |
          npm exec cap add ios || true
          npm exec cap sync ios
      - name: 注入相机/麦克风/相册权限说明
        script: |
          chmod +x scripts/inject-plist.sh
          bash scripts/inject-plist.sh
      - name: 生成 App 图标与启动页
        script: |
          npm exec capacitor-assets generate --ios || true
      - name: 配置自动代码签名
        script: xcode-project use-profiles
      - name: 归档并导出 IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        submit_to_testflight: true
      email:
        recipients:
          - your-email@example.com   # TODO: 改成你的邮箱（接收构建结果）
        notify:
          success: true
          failure: true
