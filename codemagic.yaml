# Codemagic 云端构建流水线（Windows 上无需 Mac）
# 本文件位于 Git 仓库根目录，推送到 GitHub 后 Codemagic 自动识别。
#
# 首次使用只需在 Codemagic 网页做 3 件事（详见 上架指南-Windows.md 第 4 节）：
#   1) Add application，关联 inspiredhuang-ops/aicam-ios 仓库
#   2) Team settings → Integrations → Developer Portal → Manage keys → Add key
#      名称必须填：aicam_key
#      粘贴 App Store Connect 的 Issuer ID、Key ID，上传 .p8 文件
#   3) App 设置 → Environment variables → 添加变量：
#        名称：CERTIFICATE_PRIVATE_KEY
#        值：  ios_distribution_private_key.pem 文件的完整内容（含 BEGIN/END 行）
#        变量组：code-signing，并勾选 Secure（加密）
#      构建时 Codemagic 会用它自动创建/获取 Apple Distribution 证书。
#   API 密钥 aicam_key 同时用于：自动创建证书/描述文件（签名）+ 上传 TestFlight（发布）
# 然后点 Start new build 即可。

workflows:
  ios-build:
    name: TikCam iOS -> TestFlight
    instance_type: mac_mini_m2
    max_build_duration: 45
    integrations:
      app_store_connect: aicam_key
    environment:
      groups:
        - code-signing
      node: v22
      xcode: latest
      cocoapods: default
    scripts:
      - name: 同步网页资源（web/ 快照 -> www/）
        script: |
          # 安装依赖。@capacitor/cli、@capacitor/assets 已放在 dependencies（而非
          # devDependencies），确保构建机即使以生产模式（NODE_ENV=production）安装
          # 也能拿到 cap / capacitor-assets 命令。
          # 用 && 串联：若 npm install 失败（如依赖冲突）立即中止并暴露真实错误，
          # 避免继续执行导致后续出现令人困惑的 "cap: command not found"。
          npm install && node scripts/sync-web.mjs
      - name: 添加并同步 iOS 平台（含 pod install）
        script: |
          # 使用 npm run 调用本地 node_modules/.bin 中的 cap，解析最可靠。
          # ios/ 目录被 gitignore，首次构建由 cap add ios 生成原生工程。
          npm run add:ios || true
          npm run sync:ios
      - name: 注入相机/麦克风/相册权限说明
        script: |
          chmod +x scripts/inject-plist.sh
          bash scripts/inject-plist.sh
      - name: 生成 App 图标与启动页
        script: |
          npm run assets || true
      - name: 初始化签名钥匙串
        script: keychain initialize
      - name: 自动创建/获取证书与描述文件
        script: |
          app-store-connect fetch-signing-files "com.aicam.camera" \
            --type IOS_APP_STORE \
            --create
      - name: 导入签名证书
        script: keychain add-certificates
      - name: 配置 Xcode 签名
        script: xcode-project use-profiles
      - name: 递增 Build 版本号（每次上传 TestFlight 必须更高）
        script: |
          # 使用 Codemagic 构建序号作为 CFBundleVersion，保证单调递增
          # 例如 Build #7 → version 7
          cd ios/App
          agvtool new-version -all $BUILD_NUMBER
          agvtool new-marketing-version 1.0.0
      - name: 归档并导出 IPA
        script: |
          xcode-project build-ipa \
            --workspace "$CM_BUILD_DIR/ios/App/App.xcworkspace" \
            --scheme "App"
    artifacts:
      - build/ios/ipa/*.ipa
    publishing:
      app_store_connect:
        auth: integration
        # 仅上传到 App Store Connect，不自动提交 TestFlight 审核
        # 内部测试员可直接在 TestFlight 中安装，无需审核
        submit_to_testflight: false
